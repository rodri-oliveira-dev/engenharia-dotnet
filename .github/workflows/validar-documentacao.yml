name: Validar documentação

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.ps1"
      - "**/Dockerfile"
      - ".dockerignore"
      - "**/*.py"
      - "scripts/snippets-csharp.json"
      - "**/*.slnx"
      - "**/*.tf"
      - "exemplos/c20-iac/ansible/requirements.txt"
      - "**/.terraform.lock.hcl"
      - "**/*.yml"
      - "**/*.ini"
      - "**/*.j2"
      - ".markdownlint-cli2.yaml"
      - "cspell.json"
      - "package.json"
      - ".cspell/**"
      - ".github/workflows/validar-documentacao.yml"
      - "global.json"
      - "NuGet.Config"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.ps1"
      - "**/Dockerfile"
      - ".dockerignore"
      - "**/*.py"
      - "scripts/snippets-csharp.json"
      - "**/*.slnx"
      - "**/*.tf"
      - "exemplos/c20-iac/ansible/requirements.txt"
      - "**/.terraform.lock.hcl"
      - "**/*.yml"
      - "**/*.ini"
      - "**/*.j2"
      - ".markdownlint-cli2.yaml"
      - "cspell.json"
      - "package.json"
      - ".cspell/**"
      - ".github/workflows/validar-documentacao.yml"
      - "global.json"
      - "NuGet.Config"

permissions:
  contents: read

concurrency:
  group: validar-documentacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0

      - name: Validar links internos
        shell: pwsh
        run: ./scripts/validar-links-internos.ps1

      - name: Verificar segredos em arquivos versionados
        shell: pwsh
        run: ./scripts/verificar-segredos.ps1

  ortografia-pt-br:
    name: Validar português (pt-BR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter histórico para comparar apenas texto novo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Instalar CSpell e dicionário pt-BR
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Testar seleção de linhas Markdown
        run: python -m unittest discover -s scripts/tests -p "test_validar_portugues_pr.py" -v

      - name: Verificar que erros conhecidos são encontrados
        shell: bash
        run: |
          printf 'A arquitetura de software.\n' | ./node_modules/.bin/cspell lint --config cspell.json --no-progress --no-summary stdin://teste.md
          if printf 'A arquitetturra de software.\n' | ./node_modules/.bin/cspell lint --config cspell.json --no-progress --no-summary stdin://teste.md; then
            echo "ERRO: CSpell não identificou o erro ortográfico do smoke test."
            exit 1
          fi

      - name: Verificar ortografia de texto novo
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validar-portugues-pr.py --base "$BASE_SHA" --head HEAD

  exemplos-dotnet:
    name: Compilar e testar exemplos .NET
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar SDK .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore exemplos/EngenhariaDotnet.slnx

      - name: Compilar em Release
        run: dotnet build exemplos/EngenhariaDotnet.slnx --configuration Release --no-restore

      - name: Executar testes em Release
        run: dotnet test exemplos/EngenhariaDotnet.slnx --configuration Release --no-build

  laboratorio-docker:
    name: Validar laboratório Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Construir imagem e executar smoke tests
        shell: pwsh
        run: ./scripts/testar-container-observabilidade.ps1

  snippets-csharp:
    name: Compilar snippets C#
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar SDK .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Testar validador de snippets
        run: python -m unittest discover -s scripts/tests -p "test_validar_snippets_csharp.py" -v

      - name: Compilar e validar comportamento dos snippets
        run: python scripts/validar-snippets-csharp.py

  dependencias:
    name: Analisar dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar SDK .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Testar verificador de vulnerabilidades
        run: python -m unittest discover -s scripts/tests -p "test_verificar_vulnerabilidades_nuget.py" -v

      - name: Restaurar dependências com auditoria
        run: dotnet restore exemplos/EngenhariaDotnet.slnx -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low

      - name: Reprovar pacotes vulneráveis diretos ou transitivos
        run: |
          dotnet package list --project exemplos/EngenhariaDotnet.slnx --vulnerable --include-transitive --no-restore --format json --output-version 1 > "$RUNNER_TEMP/nuget-audit.json"
          python scripts/verificar-vulnerabilidades-nuget.py "$RUNNER_TEMP/nuget-audit.json"

  exemplos-iac:
    name: Validar exemplos de IaC
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2

      - name: Validar Terraform sem aplicar
        run: |
          terraform fmt -check -recursive exemplos/c20-iac/terraform
          terraform -chdir=exemplos/c20-iac/terraform init -backend=false -input=false
          terraform -chdir=exemplos/c20-iac/terraform validate

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Instalar Ansible
        run: python -m pip install -r exemplos/c20-iac/ansible/requirements.txt

      - name: Validar sintaxe do playbook sem executar
        working-directory: exemplos/c20-iac/ansible
        run: ansible-playbook -i inventory.ini playbook.yml --syntax-check
