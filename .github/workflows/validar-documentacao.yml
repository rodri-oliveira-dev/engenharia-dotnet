name: Validar documentação

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.slnx"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/validar-documentacao.yml"
      - "global.json"
      - "NuGet.Config"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.slnx"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/validar-documentacao.yml"
      - "global.json"
      - "NuGet.Config"

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v7

      - name: Validar Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25

  exemplos-dotnet:
    name: Compilar e testar exemplos .NET
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v7

      - name: Configurar SDK .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Compilar e testar em Release
        run: dotnet test exemplos/EngenhariaDotnet.slnx --configuration Release
