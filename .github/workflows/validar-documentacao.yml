name: Validar documentação

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.slnx"
      - "**/*.tf"
      - "**/.terraform.lock.hcl"
      - "**/*.yml"
      - "**/*.ini"
      - "**/*.j2"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/validar-documentacao.yml"
      - "global.json"
      - "NuGet.Config"
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "**/*.cs"
      - "**/*.csproj"
      - "**/*.props"
      - "**/*.slnx"
      - "**/*.tf"
      - "**/.terraform.lock.hcl"
      - "**/*.yml"
      - "**/*.ini"
      - "**/*.j2"
      - ".markdownlint-cli2.yaml"
      - ".github/workflows/validar-documentacao.yml"
      - "global.json"
      - "NuGet.Config"

permissions:
  contents: read

concurrency:
  group: validar-documentacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v7

      - name: Validar Markdown
        uses: DavidAnson/markdownlint-cli2-action@v25

  exemplos-dotnet:
    name: Compilar e testar exemplos .NET
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter repositório
        uses: actions/checkout@v7

      - name: Configurar SDK .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore exemplos/EngenhariaDotnet.slnx

      - name: Compilar em Release
        run: dotnet build exemplos/EngenhariaDotnet.slnx --configuration Release --no-restore

      - name: Executar testes em Release
        run: dotnet test exemplos/EngenhariaDotnet.slnx --configuration Release --no-build

  dependencias:
    name: Analisar dependências
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter repositório
        uses: actions/checkout@v7

      - name: Configurar SDK .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restaurar dependências
        run: dotnet restore exemplos/EngenhariaDotnet.slnx

      - name: Relatar pacotes vulneráveis
        run: dotnet package list --project exemplos/EngenhariaDotnet.slnx --vulnerable --include-transitive --no-restore

  exemplos-iac:
    name: Validar exemplos de IaC
    runs-on: ubuntu-latest
    steps:
      - name: Obter repositório
        uses: actions/checkout@v7

      - name: Configurar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.2

      - name: Validar Terraform sem aplicar
        run: |
          terraform fmt -check -recursive exemplos/c20-iac/terraform
          terraform -chdir=exemplos/c20-iac/terraform init -backend=false -input=false
          terraform -chdir=exemplos/c20-iac/terraform validate

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instalar Ansible
        run: python -m pip install ansible-core==2.20.1

      - name: Validar sintaxe do playbook sem executar
        working-directory: exemplos/c20-iac/ansible
        run: ansible-playbook -i inventory.ini playbook.yml --syntax-check
